# Research specification only; NOT a runnable Stormer/Lightning CLI config.
status: proposal_not_weather_trained
backbone:
  repository: tung-nd/stormer
  commit: 58dfee5a6037399a40fefd492bc00421e0c885a8
  checkpoint_local_path: null  # must supply verified original checkpoint
  native_channels: 69
  native_grid: [128, 256]
  patch_size: 4
  step_hours: 6
  checkpoint_interval_scale: 0.1
bank:
  rank: 16
  groups: 1
  layers: [18, 20, 22, 23]
  target: attn.proj
  train_nonzero_before_probe: true
  freeze_during_response_training: true
program:
  total_dimension: 8
  slots: layer_times_step_cartesian_product
  layers: [18, 20, 22, 23]
  steps: [0, 2]
  regions: [global]
  rank_group: 0
  reference: zero
  signed: true
  componentwise_bound: 0.25  # calibrate/freeze on train/validation
  horizon_steps: 4
  max_active: 2
  declared_unit_budget: 2
  actual_sparse_execution_implemented: false
probe:
  method: central_difference
  epsilon: 0.02  # diagnose 0.01, 0.02, 0.04
  check_repeatability: true
  trajectories_per_sample_before_validation: 18
  finite_difference_accumulation: float64
  forward_precision: must_measure_and_record
  target_summary: must_define_fixed_variables_scales_area_and_leads
teacher:
  allowed_split: train_only
  solver: scipy.optimize.lsq_linear
  constraint: componentwise_box_not_L2_ball
  ridge: 0.0001
  verify_nonzero_candidates: 3
  include_noop: true
  verify_full_weather_field: true
  preserve_failures: true
student:
  features: 128
  direct_head: BoundedProgramHead
  interaction_head: InteractionUtilityHead
  interaction_outputs: 44
  utility_gram_parameterization: cholesky_psd
  runtime_future_labels: false
  runtime_teacher_probes: false
  runtime_solver: scipy_L_BFGS_B_per_support
  runtime_closed_loop_replanning_implemented: false
evaluation:
  library: weatherbenchX
  actual_library_run_this_turn: false
  leads_hours: [6, 24, 72, 120]
  aggregate_before_sqrt: true
  bootstrap_unit: initiation_time_block_or_weather_process
  baseline_information_and_budget_matched: true
  operational_improvement_guarantee: false
